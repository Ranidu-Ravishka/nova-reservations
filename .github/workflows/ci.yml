name: Feature/Task Branch CI
run-name: ${{ github.actor }} triggered CI

on:
  push:
    branches:
      - "feature/**"
      - "task/**"
  pull_request:
    branches:
      - "feature/**"
      - "task/**"

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"
  CI: true
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  # -----------------------------
  # Lint + Format
  # -----------------------------
  lint:
    name: Biome Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome – Format Check
        run: pnpm exec biome format --write=false .

      - name: Run Biome – Lint
        run: pnpm run lint

  # -----------------------------
  # TypeScript Type Check
  # -----------------------------
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript Type Check
        run: pnpm run typecheck

  # -----------------------------
  # Build Web App
  # -----------------------------
  build_web:
    name: Build Web App
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml','turbo.json','**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Build Web App
        run: pnpm turbo run build --filter=web

  # -----------------------------
  # Build Admin App
  # -----------------------------
  build_admin:
    name: Build Admin App
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml','turbo.json','**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Build Admin App
        run: pnpm turbo run build --filter=admin

  # -----------------------------
  # Build API
  # -----------------------------
  build_api:
    name: Build API
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml','turbo.json','**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Build API
        run: pnpm turbo run build --filter=api
