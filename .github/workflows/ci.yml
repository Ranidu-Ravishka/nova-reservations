name: Feature/Task Branch CI
run-name: ${{ github.actor }} triggered CI

on:
  push:
    branches:
      - "feature/**"
      - "task/**"
  pull_request:
    branches:
      - "feature/**"
      - "task/**"

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

env:
  CI: true
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # --------------------------------
  # Biome Check (Format + Lint)
  # --------------------------------
  biome:
    name: Biome Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome (lint + format)
        run: pnpm exec biome check .

  # --------------------------------
  # TypeScript Type Check
  # --------------------------------
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    needs: biome

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  # --------------------------------
  # Build Web App
  # --------------------------------
  build_web:
    name: Build Web App
    runs-on: ubuntu-latest
    needs: [biome, typecheck]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4

      - run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - run: pnpm turbo run build --filter=web

  # --------------------------------
  # Build Admin App
  # --------------------------------
  build_admin:
    name: Build Admin App
    runs-on: ubuntu-latest
    needs: [biome, typecheck]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4

      - run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - run: pnpm turbo run build --filter=admin

  # --------------------------------
  # Build API
  # --------------------------------
  build_api:
    name: Build API
    runs-on: ubuntu-latest
    needs: [biome, typecheck]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4

      - run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - run: pnpm turbo run build --filter=api
