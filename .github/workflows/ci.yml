name: Nova Reservations CI

on:
  push:
    branches: [main, task/*, feature/*, develop]
  pull_request:
    branches: [main, task/*, feature/*, develop]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  quality:
    name: Quality Gates (Biome, TypeCheck, Build)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Setup Node.js
      - name: Setup Node.js & pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      # Install pnpm globally
      - name: Setup pnpm CLI
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # Install dependencies (workspace)
      - name: Install Dependencies
        run: pnpm -w install --frozen-lockfile

      # Restore TurboRepo cache
      - name: Restore Turbo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # Biome: format check
      - name: Biome – Format Check
        run: pnpm exec biome format --write=false .

      # Biome: lint
      - name: Biome – Lint
        run: pnpm run lint

      # Type check
      - name: Type Check
        run: pnpm run typecheck

      # Build all apps via Turbo
      - name: Build Monorepo
        run: pnpm run build

  sast:
    name: SAST – CodeQL Analysis
    runs-on: ubuntu-latest
    needs: quality
    steps:
      # Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Initialize CodeQL
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      # Autobuild
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      # Run analysis
      - name: CodeQL Analyze
        uses: github/codeql-action/analyze@v3

  secrets-scan:
    name: Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      # Checkout full history to detect secrets
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Run Gitleaks scan
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: detect --source . --no-git
