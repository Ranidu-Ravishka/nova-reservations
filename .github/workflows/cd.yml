name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy
        env:
          DEPLOY_COMMAND: ${{ vars.DEPLOY_COMMAND }}
        run: |
          if [ -n "$DEPLOY_COMMAND" ]; then
            echo "Running deploy command"
            eval "$DEPLOY_COMMAND"
          else
            echo "DEPLOY_COMMAND is not set."
            echo "Set repository variable DEPLOY_COMMAND (and any needed secrets) to enable deployment."
          fi

      - name: Run post-deploy script
        env:
          POST_DEPLOY_COMMAND: ${{ vars.POST_DEPLOY_COMMAND }}
        run: |
          if [ -n "$POST_DEPLOY_COMMAND" ]; then
            echo "Running post-deploy command"
            eval "$POST_DEPLOY_COMMAND"
          else
            echo "POST_DEPLOY_COMMAND is not set."
            echo "Set repository variable POST_DEPLOY_COMMAND (and any needed secrets) to enable post-deploy script."
          fi
